version: '1.1'
languages:
  java:
    packages:
      zombie.debug:
        LogSeverity:
          extends: java.lang.Enum<zombie.debug.LogSeverity>
          notes: |-
            Used in the LuaDebugger to set the logging level of the different {@link zombie.debug.DebugType} logs. Each enums have a specific order, and selecting a lower number in the order will allow other log severities with a higher order to be logged.

            {@link zombie.debug.LogSeverity#Trace} can be used to log everything, while {@link zombie.debug.LogSeverity#Off} turns off every logs.
          modifiers:
          - public
          - final
          fields:
            LogPrefix:
              name: LogPrefix
              modifiers:
              - public
              type:
                basic: String
                full: java.lang.String
          staticFields:
            $VALUES:
              name: $VALUES
              modifiers:
              - private
              - static
              type:
                basic: LogSeverity
                full: zombie.debug.LogSeverity[]
            All:
              name: All
              modifiers:
              - public
              - static
              type:
                basic: LogSeverity
                full: zombie.debug.LogSeverity
              notes: |-
                Same as Trace.
            Debug:
              name: Debug
              modifiers:
              - public
              - static
              type:
                basic: LogSeverity
                full: zombie.debug.LogSeverity
              notes: |-
                Order: 3
            Error:
              name: Error
              modifiers:
              - public
              - static
              type:
                basic: LogSeverity
                full: zombie.debug.LogSeverity
              notes: |-
                Order: 6
            General:
              name: General
              modifiers:
              - public
              - static
              type:
                basic: LogSeverity
                full: zombie.debug.LogSeverity
              notes: |-
                Order: 4
            Noise:
              name: Noise
              modifiers:
              - public
              - static
              type:
                basic: LogSeverity
                full: zombie.debug.LogSeverity
              notes: |-
                Order: 2
            Off:
              name: Off
              modifiers:
              - public
              - static
              type:
                basic: LogSeverity
                full: zombie.debug.LogSeverity
              notes: |-
                Order: 7

                To disable any debug messages regarding the specific actions.
            Trace:
              name: Trace
              modifiers:
              - public
              - static
              type:
                basic: LogSeverity
                full: zombie.debug.LogSeverity
              notes: |-
                Order: 1

                Everything will be logged.
            Warning:
              name: Warning
              modifiers:
              - public
              - static
              type:
                basic: LogSeverity
                full: zombie.debug.LogSeverity
              notes: |-
                Order: 5
